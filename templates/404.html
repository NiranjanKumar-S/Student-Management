{% extends 'base.html' %}

{% block title %}Page Not Found - 404{% endblock %}
{% block page_title %}Error 404{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="w-20 h-20 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-4xl mb-4 shadow-sm">
        <i class="bi bi-compass"></i>
    </div>
    <h2 class="text-3xl font-black text-slate-900 tracking-tight">Page Not Found</h2>
    <p class="text-slate-500 text-sm max-w-md mt-2 mb-6">The page or student record you are looking for does not exist or may have been moved.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary bg-indigo-600 hover:bg-indigo-700 text-sm font-semibold px-5 py-2.5 rounded-xl shadow-xs">
        <i class="bi bi-house-door-fill me-1.5"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
